plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.0.18'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'org.jdbc_lab'
version = '1.0-SNAPSHOT'

ext {
    versions = [
            postgresql       : '42.7.4',
            lombok           : '1.18.30',
            slf4j            : '2.0.9',
            logback          : '1.4.14',
            junit            : '5.10.2',
            assertj          : '3.24.2',
            mockito          : '5.8.0',
            testcontainers   : '1.19.7',
            googleJavaFormat : '1.20.0',
            checkstyle       : '10.12.5',
            spotbugs         : '4.8.6'
    ]
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.postgresql:postgresql:${versions.postgresql}"

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.fatboyindustrial.gson-javatime-serialisers:gson-javatime-serialisers:1.1.1'

    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.2'

    compileOnly "org.projectlombok:lombok:${versions.lombok}"
    annotationProcessor "org.projectlombok:lombok:${versions.lombok}"
    testCompileOnly "org.projectlombok:lombok:${versions.lombok}"
    testAnnotationProcessor "org.projectlombok:lombok:${versions.lombok}"

    implementation "org.slf4j:slf4j-api:${versions.slf4j}"
    implementation "ch.qos.logback:logback-classic:${versions.logback}"

    testImplementation platform("org.junit:junit-bom:${versions.junit}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.assertj:assertj-core:${versions.assertj}"
    testImplementation "org.mockito:mockito-core:${versions.mockito}"
    testImplementation "org.mockito:mockito-junit-jupiter:${versions.mockito}"

    testImplementation "org.testcontainers:testcontainers:${versions.testcontainers}"
    testImplementation "org.testcontainers:junit-jupiter:${versions.testcontainers}"
    testImplementation "org.testcontainers:postgresql:${versions.testcontainers}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'org.jdbc_lab.Main'
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat(versions.googleJavaFormat)
                .aosp()
                .reflowLongStrings()
                .skipJavadocFormatting()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = versions.checkstyle
    configFile = file("${rootDir}/config/checkstyle/google_checks.xml")
    maxErrors = 0
    maxWarnings = 0
    ignoreFailures = true
}

jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/model/**',
                    '**/utils/InputManager.class',
                    '**/utils/MenuUtils.class',
                    '**/menus/**'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.40
            }
        }
    }
}

spotbugs {
    toolVersion = versions.spotbugs
    ignoreFailures = true
    showProgress = true
}

spotbugsMain {
    reports {
        xml.required = false
        html.required = true
    }
}

spotbugsTest {
    reports {
        xml.required = false
        html.required = true
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    finalizedBy jacocoTestReport
}

compileJava.dependsOn spotlessApply

check.dependsOn spotlessCheck
check.dependsOn jacocoTestCoverageVerification
checkstyleMain.dependsOn spotlessCheck

task formatAndCheck {
    dependsOn spotlessApply, check
    description = 'Форматирует код и выполняет все проверки'
}